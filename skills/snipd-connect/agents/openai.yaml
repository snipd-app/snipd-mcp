# Codex-only sidecar (other agents ignore this file). `dependencies` declares the MCP server this skill
# sets up, so Codex offers to install it and runs the Snipd sign-in when the skill is used without it.
interface:
  display_name: "Connect Snipd"
  short_description: "Add the Snipd MCP server and sign in"
  default_prompt: "Use $snipd-connect to connect my Snipd account."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "snipd"
      description: "Snipd MCP server: the signed-in user's podcast snips, subscriptions, shows, episodes, feeds, history and play queue"
      transport: "streamable_http"
      url: "https://mcp.snipd.com/mcp"
